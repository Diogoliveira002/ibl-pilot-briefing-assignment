<div class="ibl-card-container {{ size }}">
<mat-card [appearance]="appearance">
  @if (title || subtitle) {
    <mat-card-header>
      <ng-content select="[card-avatar]" />
      @if (title) {
        <mat-card-title>{{ title }}</mat-card-title>
      }
      @if (subtitle) {
        <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
      }
    </mat-card-header>
  }

  <mat-card-content>
    <ng-content />
  </mat-card-content>

  <mat-card-actions [class]="actionsAlign">
    <ng-content select="[card-actions]" />
  </mat-card-actions>

  <mat-card-footer>
    <ng-content select="[card-footer]" />
  </mat-card-footer>
</mat-card>
</div>
